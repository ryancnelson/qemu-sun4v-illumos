when:
  - event: push
    branch: [codex/self-contained-oci, codex/no-k-default, codex/resolver-config, codex/niagara-smp-oci]

steps:
  - name: static-appliance-policy
    # This Woodpecker installation uses the local backend: `image` is the
    # executable used to run the step, not a container image reference.
    image: bash
    commands:
      - bash -n appliances/sparc64-qemu-illumos-docker-guest/appliance appliances/sparc64-qemu-illumos-docker-guest/scripts/container-entrypoint.sh appliances/sparc64-qemu-illumos-docker-guest/scripts/container-network.sh appliances/sparc64-qemu-illumos-docker-guest/scripts/prepare-guest-release.sh appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F 'cache=writeback' appliances/sparc64-qemu-illumos-docker-guest/scripts/container-entrypoint.sh
      - grep -F 'stdio,id=guestconsole,signal=off' appliances/sparc64-qemu-illumos-docker-guest/scripts/container-entrypoint.sh
      - grep -F 'AUTO_BOOT_REQUIRED=1' appliances/sparc64-qemu-illumos-docker-guest/appliance
      - grep -F 'OCI_GUEST_PPP_NAT=PASS' appliances/sparc64-qemu-illumos-docker-guest/appliance
      - grep -F 'prepare-release-firmware.sh' appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F 'BOOT_DEVICE = "/virtual-devices@100/disk@5:a"' appliances/sparc64-qemu-illumos-docker-guest/scripts/edit-release-md.py
      - grep -F 'boot-file  = "-v"' appliances/sparc64-qemu-illumos-docker-guest/scripts/edit-release-md.py
      - grep -F 'SMP_CPUS must be exactly 2 for this firmware' appliances/sparc64-qemu-illumos-docker-guest/scripts/container-entrypoint.sh
      - grep -F 'OCI_GUEST_SMP=PASS cpus=0,1 kmdb=absent' appliances/sparc64-qemu-illumos-docker-guest/appliance
      - grep -F '0006-niagara-defer-guest-mondo-in-hypervisor.patch' appliances/sparc64-qemu-illumos-docker-guest/Dockerfile
      - grep -F 'bash ./appliance self-smp' appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F 'bash ./appliance build' appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F '/jack/BRING_UP_NETWORKING.sh' appliances/sparc64-qemu-illumos-docker-guest/appliance
      - grep -F 'nameserver 8.8.8.8' appliances/sparc64-qemu-illumos-docker-guest/scripts/install-guest-ux.py
      - "grep -F 'hosts: files dns' appliances/sparc64-qemu-illumos-docker-guest/scripts/install-guest-ux.py"
      - "grep -F 'ipnodes: files dns' appliances/sparc64-qemu-illumos-docker-guest/scripts/install-guest-ux.py"
      - test -x appliances/sparc64-qemu-illumos-docker-guest/guest-assets/BRING_UP_NETWORKING.sh
      - test -x appliances/sparc64-qemu-illumos-docker-guest/guest-assets/CALL_BBS.sh

  - name: stage-appliance-on-ec2cicd
    image: bash
    depends_on: [static-appliance-policy]
    commands:
      # The local runner does not have Tailscale MagicDNS; use ec2cicd's
      # stable tailnet address explicitly.
      - export BUILD_HOST=root@100.71.153.107
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new'
      - export REMOTE_STAGE=/tmp/woodpecker-self-contained-oci-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "mkdir -p $REMOTE_STAGE/host-tools $REMOTE_STAGE/build-tools/tools $REMOTE_STAGE/build-tools/patches"
      - scp $SSH_OPTS -r appliances/sparc64-qemu-illumos-docker-guest/. "$BUILD_HOST:$REMOTE_STAGE/"
      - scp $SSH_OPTS tools/chan/chan.h tools/chan/host-chan.py tools/chan/host-pppd-once.sh tools/chan/host-bbs.py tools/chan/isp_client.py tools/chan/isp_protocol.py "$BUILD_HOST:$REMOTE_STAGE/host-tools/"
      - scp $SSH_OPTS tools/build-mdgen.sh "$BUILD_HOST:$REMOTE_STAGE/build-tools/tools/"
      - scp $SSH_OPTS patches/0002-mdgen-x86-crossbuild.patch "$BUILD_HOST:$REMOTE_STAGE/build-tools/patches/"
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "rsync -a $REMOTE_STAGE/ /root/devel/sparc64-qemu-illumos-docker-guest/
        && chmod 0755 /root/devel/sparc64-qemu-illumos-docker-guest/appliance
        /root/devel/sparc64-qemu-illumos-docker-guest/scripts/*.sh
        /root/devel/sparc64-qemu-illumos-docker-guest/build-tools/tools/*.sh"

  - name: assemble-self-contained-image
    image: bash
    depends_on: [stage-appliance-on-ec2cicd]
    commands:
      - export BUILD_HOST=root@100.71.153.107
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new'
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        REBUILD_GUEST_RELEASE=0
        /root/devel/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh build"

  - name: cold-boot-login-test
    image: bash
    depends_on: [interactive-console-test]
    commands:
      - export BUILD_HOST=root@100.71.153.107
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new'
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        /root/devel/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh test"

  - name: interactive-console-test
    image: bash
    depends_on: [assemble-self-contained-image]
    commands:
      - export BUILD_HOST=root@100.71.153.107
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new'
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        /root/devel/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh interactive"

  - name: release-ghcr
    image: bash
    depends_on: [cold-boot-login-test]
    when:
      - branch: [codex/self-contained-oci, codex/no-k-default]
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - export BUILD_HOST=root@100.71.153.107
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new'
      - test -n "$GHCR_TOKEN"
      - >
        printf '%s' "$GHCR_TOKEN" |
        ssh $SSH_OPTS "$BUILD_HOST"
        "set -e;
        docker login ghcr.io -u ryancnelson --password-stdin;
        trap 'docker logout ghcr.io >/dev/null' EXIT;
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        RELEASE_TAG=20260903.1-${CI_COMMIT_SHA:0:12}
        LATEST_TAG=amd64
        /root/devel/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh release"
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "mkdir -p /tmp/ghcr-anonymous-woodpecker-$CI_PIPELINE_NUMBER;
        docker --config /tmp/ghcr-anonymous-woodpecker-$CI_PIPELINE_NUMBER
        manifest inspect ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:amd64
        >/dev/null;
        echo OCI_ANONYMOUS_MANIFEST=PASS"
