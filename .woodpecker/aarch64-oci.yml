when:
  - event: [push, manual]
    branch: codex/aarch64-guest-ux

steps:
  - name: static-arm64-policy
    image: bash
    commands:
      - bash -n appliances/sparc64-qemu-illumos-docker-guest/appliance appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F 'QEMU_CONTRACT_ID=sparc-tlb-range-flush-v1' appliances/sparc64-qemu-illumos-docker-guest/qemu-contract.env
      - grep -F 'verify-qemu-contract.py' appliances/sparc64-qemu-illumos-docker-guest/Dockerfile
      - grep -F 'LATEST_TAG=' appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-self-contained-oci.sh
      - grep -F 'data-root' infra/niagara-playbox/docker-daemon.json

  - name: stage-on-niagara-playbox
    image: bash
    depends_on: [static-arm64-policy]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export AMD64_BUILD_HOST=root@100.71.153.107
      - export CACHE_HOST=biggie
      - export CACHE_DIR=/opt/tribblix-woodpecker/cache/niagara-arm64
      - export PLAYBOX_CACHE=/mnt/disk-images/woodpecker/cache
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/niagara-arm64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$PLAYBOX" "mkdir -p $WORK/sources $WORK/release $WORK/assets $WORK/host-tools $WORK/build-tools/tools $WORK/build-tools/patches $PLAYBOX_CACHE"
      - scp $SSH_OPTS -r appliances/sparc64-qemu-illumos-docker-guest/. "$PLAYBOX:$WORK/"
      - scp $SSH_OPTS appliances/sparc64-qemu-illumos-docker-guest/RELEASE-ARCHIVE.SHA256SUMS "$PLAYBOX:$WORK/release/"
      - scp $SSH_OPTS tools/chan/chan.h tools/chan/host-chan.py tools/chan/host-pppd-once.sh tools/chan/host-bbs.py tools/chan/isp_client.py tools/chan/isp_protocol.py "$PLAYBOX:$WORK/host-tools/"
      - scp $SSH_OPTS tools/build-mdgen.sh "$PLAYBOX:$WORK/build-tools/tools/"
      - scp $SSH_OPTS patches/0002-mdgen-x86-crossbuild.patch "$PLAYBOX:$WORK/build-tools/patches/"
      - ssh $SSH_OPTS "$AMD64_BUILD_HOST" "scp $SSH_OPTS /root/devel/sparc64-qemu-illumos-docker-guest/sources/qemu-049affb20df67162cf58deeaf74d5ad4b83cbdc3.tar.gz $PLAYBOX:$WORK/sources/"
      - ssh $SSH_OPTS "$AMD64_BUILD_HOST" "scp $SSH_OPTS -r /root/devel/sparc64-qemu-illumos-docker-guest/assets/firmware $PLAYBOX:$WORK/assets/"
      - >
        ssh $SSH_OPTS "$CACHE_HOST"
        "sudo -n install -d -o ryan -g ryan $CACHE_DIR &&
        sudo -n docker pull --platform linux/amd64
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:20260902.2-95830e8fc31d &&
        sudo -n docker rm -f niagara-arm64-asset-source-$CI_PIPELINE_NUMBER >/dev/null 2>&1 || true;
        sudo -n docker create --platform linux/amd64
        --name niagara-arm64-asset-source-$CI_PIPELINE_NUMBER
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:20260902.2-95830e8fc31d >/dev/null &&
        sudo -n docker cp niagara-arm64-asset-source-$CI_PIPELINE_NUMBER:/opt/illumos-appliance/beta.tar.zst
        $CACHE_DIR/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst &&
        sudo -n docker rm niagara-arm64-asset-source-$CI_PIPELINE_NUMBER >/dev/null &&
        sudo -n chown ryan:ryan $CACHE_DIR/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst"
      - >
        if ! ssh $SSH_OPTS "$PLAYBOX"
        "printf '%s  %s\n' 70c406af6b8780a31eab865dffcbac5863d4efaa1fd3261c529e8afc7d0d7384
        $PLAYBOX_CACHE/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst | sha256sum -c -";
        then
        ssh $SSH_OPTS "$CACHE_HOST"
        "scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        $CACHE_DIR/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst
        $PLAYBOX:$PLAYBOX_CACHE/";
        fi
      - ssh $SSH_OPTS "$PLAYBOX" "cp --reflink=auto $PLAYBOX_CACHE/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst $WORK/release/"
      - ssh $SSH_OPTS "$PLAYBOX" "cd $WORK && (cd sources && sha256sum -c SHA256SUMS) && (cd release && sha256sum -c RELEASE-ARCHIVE.SHA256SUMS) && docker info --format '{{.Architecture}}' | grep -Fx aarch64"

  - name: native-arm64-build
    image: bash
    depends_on: [stage-on-niagara-playbox]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/niagara-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "cd $WORK &&
        IMAGE=sparc64-qemu-illumos-guest:arm64-local bash ./appliance build &&
        APPLIANCE_ROOT=$WORK REBUILD_RELEASE_FIRMWARE=0
        REBUILD_GUEST_RELEASE=2
        IMAGE=sparc64-qemu-illumos-guest:arm64-local
        SELF_IMAGE=sparc64-qemu-openindiana-20g:arm64-self-contained
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER bash ./scripts/ci-self-contained-oci.sh build &&
        docker image inspect sparc64-qemu-openindiana-20g:arm64-self-contained
        --format 'OCI_ARM64_BUILD=PASS arch={{.Architecture}} id={{.Id}} bytes={{.Size}}'"

  - name: native-arm64-boot-test
    image: bash
    depends_on: [native-arm64-build]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/niagara-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "APPLIANCE_ROOT=$WORK
        SELF_IMAGE=sparc64-qemu-openindiana-20g:arm64-self-contained
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER bash $WORK/scripts/ci-self-contained-oci.sh interactive &&
        APPLIANCE_ROOT=$WORK
        SELF_IMAGE=sparc64-qemu-openindiana-20g:arm64-self-contained
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER bash $WORK/scripts/ci-self-contained-oci.sh test"

  - name: release-arm64-and-multiarch
    image: bash
    depends_on: [native-arm64-boot-test]
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    when:
      - branch: codex/aarch64-guest-ux
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/niagara-arm64-${CI_PIPELINE_NUMBER}
      - export ARM64_TAG=20260902.3-arm64-${CI_COMMIT_SHA:0:12}
      - export MULTIARCH_TAG=20260902.3-${CI_COMMIT_SHA:0:12}
      - test -n "$GHCR_TOKEN"
      - >
        printf '%s' "$GHCR_TOKEN" |
        ssh $SSH_OPTS "$PLAYBOX"
        "set -e;
        docker login ghcr.io -u ryancnelson --password-stdin;
        trap 'docker logout ghcr.io >/dev/null' EXIT;
        APPLIANCE_ROOT=$WORK
        SELF_IMAGE=sparc64-qemu-openindiana-20g:arm64-self-contained
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        RELEASE_TAG=$ARM64_TAG
        LATEST_TAG=arm64 bash $WORK/scripts/ci-self-contained-oci.sh release;
        docker manifest rm ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:$MULTIARCH_TAG >/dev/null 2>&1 || true;
        docker manifest create ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:$MULTIARCH_TAG
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:20260902.2-95830e8fc31d
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:$ARM64_TAG;
        docker manifest push --purge ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:$MULTIARCH_TAG;
        docker manifest rm ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:latest >/dev/null 2>&1 || true;
        docker manifest create ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:latest
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:20260902.2-95830e8fc31d
        ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:$ARM64_TAG;
        docker manifest push --purge ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:latest;
        docker manifest inspect ghcr.io/ryancnelson/sparc64-qemu-openindiana-20g:latest |
        python3 -c 'import json,sys; d=json.load(sys.stdin); a=sorted(x[\"platform\"][\"architecture\"] for x in d[\"manifests\"]); assert a == [\"amd64\", \"arm64\"], a; print(\"OCI_MULTIARCH_RELEASE=PASS architectures=amd64,arm64\")'"
