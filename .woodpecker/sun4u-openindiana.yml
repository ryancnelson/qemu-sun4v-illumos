when:
  - event: [push, manual]
    branch: codex/nevada-b134-resume-20261024

steps:
  - name: sun4u-static-policy
    # Biggie's Woodpecker runner uses the local backend; `image` names the
    # executable used for the step rather than a container image.
    image: bash
    commands:
      - bash -n scripts/build-openbios-sun4u-solaris.sh scripts/ci-openbios-sun4u-boot.sh
      - test -x scripts/build-openbios-sun4u-solaris.sh
      - test -x scripts/ci-openbios-sun4u-boot.sh
      - grep -F 'af97fd7af5e7c18f591a7b987291d3db4ffb28b5' scripts/build-openbios-sun4u-solaris.sh
      - grep -F 'EXTRACFLAGS=-fno-stack-protector' scripts/build-openbios-sun4u-solaris.sh
      - grep -F "'%g7 + 0x28'" scripts/build-openbios-sun4u-solaris.sh
      - grep -F 'SUN4U_OPENBIOS_BOOT=PASS' scripts/ci-openbios-sun4u-boot.sh

  - name: sun4u-stage-on-playbox
    image: bash
    depends_on: [sun4u-static-policy]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/sun4u-openbios-${CI_PIPELINE_NUMBER}
      - 'echo "CI_LANE=sun4u-openindiana branch=$CI_COMMIT_BRANCH commit=$CI_COMMIT_SHA pipeline=$CI_PIPELINE_NUMBER host=$PLAYBOX work=$WORK"'
      - ssh $SSH_OPTS "$PLAYBOX" "test ! -e $WORK && mkdir -p $WORK/project/scripts $WORK/project/patches/openbios $WORK/artifacts $WORK/run"
      - scp $SSH_OPTS scripts/build-openbios-sun4u-solaris.sh scripts/ci-openbios-sun4u-boot.sh "$PLAYBOX:$WORK/project/scripts/"
      - scp $SSH_OPTS patches/openbios/0001-aarch64-host-bitwidth.patch patches/openbios/0002-sun4u-solaris-device-paths.patch "$PLAYBOX:$WORK/project/patches/openbios/"
      - ssh $SSH_OPTS "$PLAYBOX" "chmod 0755 $WORK/project/scripts/*.sh"
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "test \$(docker image inspect solaris9-sun4m-workbench:arm64 --format '{{.Id}}') =
        sha256:56dac302ff0a10a576bd39f9df942e3833b759c5eb1b525ebd86f548f7bf022f &&
        printf '%s  %s\n'
        c1ac3fb8bae47d4b8421d7a5506a33b05b1189c9ba731e0e560f78b140f228e0
        /mnt/disk-images/solaris9-b134-ufsboot-trial-001/textinstall-134-sparc.iso |
        sha256sum -c -"

  - name: sun4u-build-openbios
    image: bash
    depends_on: [sun4u-stage-on-playbox]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/sun4u-openbios-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "set -o pipefail;
        git clone --filter=blob:none --no-checkout
        https://gitlab.com/qemu-project/openbios.git $WORK/openbios &&
        git -C $WORK/openbios checkout --detach
        af97fd7af5e7c18f591a7b987291d3db4ffb28b5 &&
        JOBS=2 $WORK/project/scripts/build-openbios-sun4u-solaris.sh
        $WORK/openbios $WORK/artifacts/openbios-sparc64.patched |
        tee $WORK/build.log"

  - name: sun4u-boot-installer-and-check-input
    image: bash
    depends_on: [sun4u-build-openbios]
    commands:
      - export PLAYBOX=root@100.112.174.2
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export WORK=/mnt/disk-images/woodpecker/sun4u-openbios-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "set -o pipefail;
        CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER
        SUN4U_RAM_MIB=512
        SUN4U_CONTAINER_NAME=sun4u-openbios-woodpecker-$CI_PIPELINE_NUMBER
        $WORK/project/scripts/ci-openbios-sun4u-boot.sh
        $WORK/artifacts/openbios-sparc64.patched $WORK/run |
        tee $WORK/boot-test.log"
      - >
        ssh $SSH_OPTS "$PLAYBOX"
        "set -o pipefail;
        sha256sum $WORK/artifacts/openbios-sparc64.patched
        $WORK/build.log $WORK/boot-test.log $WORK/run/console.log |
        tee $WORK/RESULT-SHA256SUMS"
