when:
  - event: [push, manual]
    branch: codex/softint-dualarch-release

steps:
  - name: golden-static-contract
    image: bash
    commands:
      - pwd
      - test -f appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-golden-volume.sh
      - bash -n appliances/sparc64-qemu-illumos-docker-guest/appliance appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-golden-volume.sh

  - name: golden-amd64-stage
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "test ! -e $WORK && mkdir -p $WORK/host-tools $WORK/sources $WORK/release $WORK/assets $WORK/state/opensparc $WORK/tests/unit $WORK/.woodpecker"
      - scp $SSH_OPTS -r appliances/sparc64-qemu-illumos-docker-guest/. "$BUILD_HOST:$WORK/"
      - scp $SSH_OPTS tools/chan/chan.h tools/chan/host-chan.py tools/chan/host-pppd-once.sh tools/chan/host-bbs.py tools/chan/isp_client.py tools/chan/isp_protocol.py "$BUILD_HOST:$WORK/host-tools/"
      - scp $SSH_OPTS tests/unit/test_cross_arch_golden_volume.py "$BUILD_HOST:$WORK/tests/unit/"
      - scp $SSH_OPTS .woodpecker/golden-volume-amd64.yml .woodpecker/golden-volume-arm64.yml "$BUILD_HOST:$WORK/.woodpecker/"
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "scp -o BatchMode=yes
        root@100.71.153.107:/root/devel/sparc64-qemu-illumos-docker-guest/sources/qemu-049affb20df67162cf58deeaf74d5ad4b83cbdc3.tar.gz $WORK/sources/ &&
        scp -o BatchMode=yes
        root@100.71.153.107:/root/devel/sparc64-qemu-illumos-docker-guest/release/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst $WORK/release/ &&
        scp -o BatchMode=yes -r root@100.71.153.107:/root/devel/sparc64-qemu-illumos-docker-guest/assets/firmware $WORK/assets/ &&
        chmod 0755 $WORK/appliance $WORK/scripts/*.sh"

  - name: golden-policy-on-biggie
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && python3 -m unittest discover -s tests/unit -p test_cross_arch_golden_volume.py"

  - name: golden-amd64-seed-build
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=seed-build
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-seed-first-boot
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=seed-first
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-freeze
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=freeze
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-build
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=golden-build
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-test-first
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=test-first
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-test-second
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - export phase=test-second
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-amd64-publish
    image: bash
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - test -n "$GHCR_TOKEN"
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - >-
        printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o ConnectTimeout=15 biggie
        "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/publish-golden.sh"

  - name: golden-amd64-cleanup
    image: bash
    when:
      - status: [success, failure]
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=biggie
      - export WORK=/tmp/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "test ! -f $WORK/scripts/ci-golden-volume.sh || (cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=amd64 bash scripts/ci-golden-volume.sh cleanup)"
