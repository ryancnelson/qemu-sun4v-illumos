when:
  - event: [push, manual]
    branch: codex/snet-driver

steps:
  - name: build-snet-on-biggie
    image: bash
    commands:
      - export REMOTE_STAGE=/tmp/woodpecker-snet-${CI_PIPELINE_NUMBER}
      - ssh -o BatchMode=yes biggie "mkdir -p $REMOTE_STAGE"
      - tar -cf - --exclude=.git . | ssh -o BatchMode=yes biggie "tar -xf - -C $REMOTE_STAGE"
      - ssh -o BatchMode=yes biggie "flock /tmp/woodpecker-snet.lock $REMOTE_STAGE/scripts/ci-snet-on-biggie.sh"
