when:
  - event: [push, manual]
    branch: codex/snet-driver

steps:
  - name: protocol-contract
    image: bash
    commands:
      - python3 -m unittest discover -s tools/snet -p 'test_*.py' -v
      - python3 -m py_compile tools/snet/protocol.py tools/snet/test_protocol.py
      - test -s include/sun4v_snet_protocol.h

