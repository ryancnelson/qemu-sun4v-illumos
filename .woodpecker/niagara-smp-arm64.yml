# Native ARM build and boot gates. The contract branch rebuilds and tests but
# deliberately does not publish a moving preview tag.
when:
  - event: push
    branch: [codex/niagara-smp-arm64, codex/qemu-contract-gate]

# Consume the guest bundle produced and verified by the matching AMD64 run.
depends_on: [self-contained-oci]

steps:
  - name: arm64-stage
    image: bash
    commands:
      - bash -n appliances/sparc64-qemu-illumos-docker-guest/scripts/ci-smp-arm64.sh
      - grep -F 'QEMU_CONTRACT_ID=sparc-tlb-range-flush-v1' appliances/sparc64-qemu-illumos-docker-guest/qemu-contract.env
      - grep -F 'verify-qemu-contract.py' appliances/sparc64-qemu-illumos-docker-guest/Dockerfile
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "test ! -e $WORK && mkdir -p $WORK/host-tools $WORK/assets"
      - scp $SSH_OPTS -r appliances/sparc64-qemu-illumos-docker-guest/. "$BUILD_HOST:$WORK/"
      - scp $SSH_OPTS tools/chan/chan.h tools/chan/host-chan.py tools/chan/host-pppd-once.sh tools/chan/host-bbs.py tools/chan/isp_client.py tools/chan/isp_protocol.py "$BUILD_HOST:$WORK/host-tools/"
      - >
        set -o pipefail;
        ssh $SSH_OPTS root@100.71.153.107
        "cd /root/devel/sparc64-qemu-illumos-docker-guest &&
        test -f state/self-contained/woodpecker-$CI_PIPELINE_NUMBER-accepted &&
        tar -cf - release/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst
        assets.release.SHA256SUMS RELEASE-ARCHIVE.SHA256SUMS assets/firmware firmware.SHA256SUMS"
        | ssh $SSH_OPTS "$BUILD_HOST" "tar -xf - -C $WORK"
      - ssh $SSH_OPTS "$BUILD_HOST" "chmod 0755 $WORK/appliance $WORK/scripts/*.sh"

  - name: arm64-prepare
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh prepare"

  - name: arm64-build
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh build"

  - name: arm64-boot
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh boot"

  - name: arm64-cpus
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh cpus"

  - name: arm64-publish
    image: bash
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    when:
      - branch: codex/niagara-smp-arm64
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - test -n "$GHCR_TOKEN"
      - >
        printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$BUILD_HOST"
        "CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh publish"

  - name: arm64-cleanup
    image: bash
    when:
      - status: [success, failure]
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/niagara-smp-arm64-${CI_PIPELINE_NUMBER}
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "test ! -f $WORK/scripts/ci-smp-arm64.sh || CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA
        bash $WORK/scripts/ci-smp-arm64.sh cleanup"
