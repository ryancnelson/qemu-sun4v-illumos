when:
  - event: [push, manual]
    branch: codex/cross-arch-golden-volume

depends_on: [golden-volume-amd64]

steps:
  - name: golden-arm64-stage-identical-payload
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/golden-volume-arm64-${CI_PIPELINE_NUMBER}
      - export AMD_WORK=/tank/niagara-ci/golden-volume/golden-volume-amd64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "test ! -e $WORK && mkdir -p $WORK/host-tools $WORK/sources $WORK/release $WORK/assets $WORK/state/golden"
      - scp $SSH_OPTS -r appliances/sparc64-qemu-illumos-docker-guest/. "$BUILD_HOST:$WORK/"
      - scp $SSH_OPTS tools/chan/chan.h tools/chan/host-chan.py tools/chan/host-pppd-once.sh tools/chan/host-bbs.py tools/chan/isp_client.py tools/chan/isp_protocol.py "$BUILD_HOST:$WORK/host-tools/"
      - ssh $SSH_OPTS "$BUILD_HOST" "cp --reflink=always /mnt/disk-images/woodpecker/niagara-arm64-47/sources/qemu-049affb20df67162cf58deeaf74d5ad4b83cbdc3.tar.gz $WORK/sources/"
      - >
        set -o pipefail;
        ssh $SSH_OPTS root@100.71.153.107
        "cd $AMD_WORK && tar -cf -
        release/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst
        RELEASE-ARCHIVE.SHA256SUMS assets.release.SHA256SUMS assets/firmware
        state/golden/root.sha256 state/golden/assets.release.SHA256SUMS
        state/golden/RELEASE-ARCHIVE.SHA256SUMS
        state/golden/sparc64-qemu-openindiana-20g-beta-20260901.tar.zst"
        | ssh $SSH_OPTS "$BUILD_HOST" "tar -xf - -C $WORK"
      - >
        ssh $SSH_OPTS "$BUILD_HOST"
        "cd $WORK && cmp assets.release.SHA256SUMS state/golden/assets.release.SHA256SUMS &&
        cmp RELEASE-ARCHIVE.SHA256SUMS state/golden/RELEASE-ARCHIVE.SHA256SUMS &&
        (cd release && sha256sum -c ../RELEASE-ARCHIVE.SHA256SUMS) &&
        chmod 0755 appliance scripts/*.sh"

  - name: golden-arm64-build
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/golden-volume-arm64-${CI_PIPELINE_NUMBER}
      - export phase=golden-build
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=arm64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-arm64-test-first
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/golden-volume-arm64-${CI_PIPELINE_NUMBER}
      - export phase=test-first
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=arm64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-arm64-test-second
    image: bash
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/golden-volume-arm64-${CI_PIPELINE_NUMBER}
      - export phase=test-second
      - ssh $SSH_OPTS "$BUILD_HOST" "cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=arm64 bash scripts/ci-golden-volume.sh $phase"

  - name: golden-arm64-cleanup
    image: bash
    when:
      - status: [success, failure]
    commands:
      - export SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      - export BUILD_HOST=root@100.112.174.2
      - export WORK=/mnt/disk-images/woodpecker/golden-volume-arm64-${CI_PIPELINE_NUMBER}
      - ssh $SSH_OPTS "$BUILD_HOST" "test ! -f $WORK/scripts/ci-golden-volume.sh || (cd $WORK && CI_PIPELINE_NUMBER=$CI_PIPELINE_NUMBER CI_COMMIT_SHA=$CI_COMMIT_SHA GOLDEN_ARCH=arm64 bash scripts/ci-golden-volume.sh cleanup)"
